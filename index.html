<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>默写经文</title>
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/memory.css">
</head>
<body>
  <div class="header">
    <div style="display: flex; align-items: center; gap: 12px;">
      <button class="hamburger" id="menuBtn">☰</button>
      <h1>默写经文</h1>
    </div>
    <a href="view.html" class="nav-link">👁️ 查看经文</a>
  </div>

  <div class="menu-overlay" id="menuOverlay"></div>
  <div class="menu-panel" id="menuPanel">
    <div class="menu-header">
      <h3>提示模式</h3>
      <button class="menu-close" id="menuClose">×</button>
    </div>
    <div class="menu-section">
      <label class="menu-label">选择提示内容</label>
      <div class="menu-tabs">
        <a class="menu-tab" href="index.html" data-mode="both">章节＋开头</a>
        <a class="menu-tab" href="?mode=ref" data-mode="reference">只有章节</a>
        <a class="menu-tab" href="?mode=full" data-mode="text-only">经文</a>
        <a class="menu-tab" href="?mode=prefix" data-mode="prefix">只有开头</a>
        <a class="menu-tab" href="?mode=random" data-mode="random">随机</a>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div id="hint" class="hint">
      <div id="topRef" class="ref-line">加载中...</div>
      <div class="verse-compose">
        <span id="prefixLead" class="prefix-lead" hidden></span><div id="verseLine" class="verse-line"></div>
      </div>
      <div id="bottomRef" class="ref-line"></div>
    </div>
    <div class="note" id="modeNote"></div>
    <div class="note">操作：回车检查，再次回车下一题。</div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/memory-utils.js"></script>
  <script>
    const HINT_MODE_KEY = "scriptureHintMode";

    const els = {
      topRef: document.getElementById("topRef"),
      prefixLead: document.getElementById("prefixLead"),
      verseLine: document.getElementById("verseLine"),
      bottomRef: document.getElementById("bottomRef"),
      modeNote: document.getElementById("modeNote"),
      menuBtn: document.getElementById("menuBtn"),
      menuOverlay: document.getElementById("menuOverlay"),
      menuPanel: document.getElementById("menuPanel"),
      menuClose: document.getElementById("menuClose"),
      menuTabs: document.querySelectorAll(".menu-tab[data-mode]")
    };

    const MODE_TASKS = {
      "both":      "章节＋经文开头 → 默写剩余经文",
      "reference": "只有章节 → 默写完整经文",
      "text-only": "完整经文 → 默写章节出处",
      "prefix":    "只有经文开头 → 默写章节和剩余经文"
    };

    const state = {
      verses: [],
      current: null,
      mode: "both",     // resolved per-question mode
      hintMode: "both", // user setting (persisted)
      prefixText: "",
      checked: false
    };

    const scriptureData = new ScriptureData();

    const URL_TO_HINT = { start: "both", ref: "reference", full: "text-only", prefix: "prefix", random: "random" };
    const HINT_TO_URL = { both: "start", reference: "ref", "text-only": "full", prefix: "prefix", random: "random" };

    // --- Persistence ---
    function loadHintMode() {
      const urlMode = new URLSearchParams(window.location.search).get("mode");
      if (urlMode && URL_TO_HINT[urlMode]) {
        const mode = URL_TO_HINT[urlMode];
        localStorage.setItem(HINT_MODE_KEY, mode);
        return mode;
      }
      return localStorage.getItem(HINT_MODE_KEY) || "both";
    }
    function saveHintMode(mode) {
      localStorage.setItem(HINT_MODE_KEY, mode);
      const url = new URL(window.location);
      if (mode === "both") {
        url.searchParams.delete("mode");
      } else {
        url.searchParams.set("mode", HINT_TO_URL[mode]);
      }
      history.replaceState({}, "", url);
    }

    // --- Menu ---
    function openMenu() {
      els.menuOverlay.classList.add("active");
      els.menuPanel.classList.add("active");
    }
    function closeMenu() {
      els.menuOverlay.classList.remove("active");
      els.menuPanel.classList.remove("active");
    }
    function updateMenuActiveTab() {
      els.menuTabs.forEach(tab => {
        tab.classList.toggle("active", tab.dataset.mode === state.hintMode);
      });
    }

    els.menuBtn.addEventListener("click", openMenu);
    els.menuClose.addEventListener("click", closeMenu);
    els.menuOverlay.addEventListener("click", closeMenu);
    els.menuTabs.forEach(tab => {
      tab.addEventListener("click", (e) => {
        e.preventDefault();
        state.hintMode = tab.dataset.mode;
        saveHintMode(state.hintMode);
        updateMenuActiveTab();
        closeMenu();
        newQuestion();
      });
    });

    // --- Mode resolution ---
    function resolveHintMode() {
      if (state.hintMode === "random") {
        const modes = ["both", "reference", "text-only", "prefix"];
        return modes[Math.floor(Math.random() * 4)];
      }
      return state.hintMode;
    }

    function updateModeNote() {
      const label = MODE_TASKS[state.mode] || state.mode;
      const suffix = state.hintMode === "random" ? "（随机）" : "";
      els.modeNote.textContent = `当前：${label}${suffix}`;
    }

    // --- Layout helpers ---
    function syncFillLayoutHeight() {
      if (!els.verseLine.classList.contains("fill-mode")) {
        els.verseLine.style.minHeight = "56px";
        els.bottomRef.style.marginTop = "2px";
        return;
      }
      const placeholderText = els.verseLine.getAttribute("data-placeholder") || "";
      const placeholderHeight = MemoryUtils.measurePlaceholderHeight(placeholderText, els.verseLine);
      const targetHeight = Math.max(56, placeholderHeight + 8);
      els.verseLine.style.minHeight = `${targetHeight}px`;
      els.bottomRef.style.marginTop = "8px";
    }

    function syncFillUnderline() {
      if (state.mode === "text-only") return;
      const hasInput = MemoryUtils.normalize(els.verseLine.textContent).length > 0;
      els.verseLine.classList.toggle("has-input", hasInput);
      state.checked = false;
    }

    function enableReferenceFillMode(referenceText) {
      const placeholder = MemoryUtils.toBlankLine(referenceText);
      els.topRef.classList.add("ref-fill");
      els.bottomRef.classList.add("ref-fill");
      els.topRef.setAttribute("contenteditable", "true");
      els.topRef.setAttribute("data-placeholder", placeholder);
      els.bottomRef.removeAttribute("contenteditable");
      els.bottomRef.setAttribute("data-placeholder", placeholder);
      els.topRef.textContent = "";
      els.bottomRef.textContent = "";
      els.topRef.classList.remove("has-input");
      els.bottomRef.classList.remove("has-input");
    }

    function disableReferenceFillMode(referenceText) {
      els.topRef.classList.remove("ref-fill", "has-input");
      els.bottomRef.classList.remove("ref-fill", "has-input");
      els.topRef.removeAttribute("contenteditable");
      els.topRef.removeAttribute("data-placeholder");
      els.bottomRef.removeAttribute("contenteditable");
      els.bottomRef.removeAttribute("data-placeholder");
      els.topRef.textContent = referenceText || "";
      els.bottomRef.textContent = referenceText || "";
    }

    function syncReferenceMirror() {
      if (state.mode !== "prefix" && state.mode !== "text-only") return;
      const text = els.topRef.textContent || "";
      const hasInput = MemoryUtils.normalize(text).length > 0;
      els.topRef.classList.toggle("has-input", hasInput);
      els.bottomRef.classList.toggle("has-input", hasInput);
      els.bottomRef.textContent = text;
      state.checked = false;
    }

    function getExpectedCandidates() {
      if (!state.current) return [""];
      if (state.mode === "reference") return [state.current.text];
      if (state.mode === "text-only") return [state.current.reference];
      // "both" and "prefix": remaining text after prefix
      return [state.current.text.slice(state.prefixText.length)];
    }

    function applyInlineDiffColoring() {
      if (!state.current || state.mode === "text-only") return;
      const rawUserInput = els.verseLine.textContent || "";
      const rawUser = state.mode === "prefix"
        ? MemoryUtils.stripLeadingPromptText(rawUserInput, state.prefixText)
        : rawUserInput;
      const caretOffset = MemoryUtils.getCaretOffsetWithin(els.verseLine);
      const expectedRaw = MemoryUtils.bestExpectedForUser(rawUser, getExpectedCandidates());
      els.verseLine.innerHTML = MemoryUtils.renderComparedInput(rawUser, expectedRaw);
      MemoryUtils.setCaretOffsetWithin(els.verseLine, caretOffset);
    }

    function applyReferenceDiffColoring() {
      if (!state.current) return;
      if (state.mode !== "prefix" && state.mode !== "text-only") return;
      const rawRef = els.topRef.textContent || "";
      const expected = state.current.reference || "";
      const html = MemoryUtils.renderComparedInput(rawRef, expected);
      els.topRef.innerHTML = html;
      els.bottomRef.innerHTML = html;
      const hasInput = MemoryUtils.normalize(rawRef).length > 0;
      els.topRef.classList.toggle("has-input", hasInput);
      els.bottomRef.classList.toggle("has-input", hasInput);
    }

    function newQuestion() {
      if (!state.verses.length) return;
      state.current = MemoryUtils.randomItem(state.verses);
      state.mode = resolveHintMode();
      state.prefixText = "";

      const verse = state.current;
      const fullText = verse.text;
      const prefixLen = Math.max(4, Math.min(12, Math.floor(fullText.length * 0.18)));

      // Reset verseLine
      els.verseLine.classList.remove("fill-mode", "has-input", "hint-display");
      els.verseLine.removeAttribute("contenteditable");
      els.verseLine.removeAttribute("data-placeholder");
      els.verseLine.textContent = "";

      if (state.mode === "both") {
        // Show reference + verse beginning; user fills remaining verse
        state.prefixText = fullText.slice(0, prefixLen);
        const remainText = fullText.slice(prefixLen);
        disableReferenceFillMode(verse.reference);
        els.prefixLead.hidden = false;
        els.prefixLead.textContent = state.prefixText;
        els.verseLine.classList.add("fill-mode");
        els.verseLine.setAttribute("contenteditable", "true");
        els.verseLine.setAttribute("data-placeholder", MemoryUtils.toBlankLine(remainText));
      } else if (state.mode === "reference") {
        // Show only reference; user fills full verse
        disableReferenceFillMode(verse.reference);
        els.prefixLead.hidden = true;
        els.prefixLead.textContent = "";
        els.verseLine.classList.add("fill-mode");
        els.verseLine.setAttribute("contenteditable", "true");
        els.verseLine.setAttribute("data-placeholder", MemoryUtils.toBlankLine(fullText));
      } else if (state.mode === "text-only") {
        // Show full verse; user fills reference
        enableReferenceFillMode(verse.reference);
        els.prefixLead.hidden = true;
        els.prefixLead.textContent = "";
        els.verseLine.classList.add("hint-display");
        els.verseLine.textContent = fullText;
      } else { // "prefix"
        // Show only verse beginning; user fills reference + remaining verse
        state.prefixText = fullText.slice(0, prefixLen);
        const remainText = fullText.slice(prefixLen);
        enableReferenceFillMode(verse.reference);
        els.prefixLead.hidden = false;
        els.prefixLead.textContent = state.prefixText;
        els.verseLine.classList.add("fill-mode");
        els.verseLine.setAttribute("contenteditable", "true");
        els.verseLine.setAttribute("data-placeholder", MemoryUtils.toBlankLine(remainText));
        syncReferenceMirror();
      }

      syncFillLayoutHeight();
      updateModeNote();
      state.checked = false;

      if (state.mode === "text-only" || state.mode === "prefix") {
        els.topRef.focus();
      } else {
        els.verseLine.focus();
      }
    }

    function checkAnswer() {
      if (!state.current) return;
      applyInlineDiffColoring();
      applyReferenceDiffColoring();
      state.checked = true;
    }

    function onEnterPressed(e) {
      if (e.key !== "Enter") return;
      e.preventDefault();
      if (state.checked) {
        newQuestion();
      } else {
        checkAnswer();
      }
    }

    async function init() {
      state.hintMode = loadHintMode();
      saveHintMode(state.hintMode); // sync URL with loaded mode
      updateMenuActiveTab();
      try {
        const data = await scriptureData.initialize();
        state.verses = data.verses;
        newQuestion();
      } catch (e) {
        els.topRef.textContent = "加载失败";
        els.prefixLead.hidden = true;
        els.prefixLead.textContent = "";
        els.verseLine.textContent = "请确认 verses/ 下有 json 文件，或提供 groups.json，并在当前目录启动本地服务访问页面。";
        els.bottomRef.textContent = "";
        console.error(e);
      }
    }

    // Event listeners
    els.topRef.addEventListener("input", syncReferenceMirror);
    els.topRef.addEventListener("keydown", onEnterPressed);
    els.verseLine.addEventListener("keydown", onEnterPressed);
    els.verseLine.addEventListener("input", syncFillUnderline);
    window.addEventListener("resize", syncFillLayoutHeight);

    init();
  </script>
</body>
</html>
