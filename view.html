<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>查看经文</title>
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/view.css">
</head>
<body>
  <header class="header">
    <div style="display: flex; align-items: center; gap: 12px;">
      <button class="hamburger" id="hamburger">☰</button>
      <h1>查看经文</h1>
    </div>
    <a href="index.html" class="nav-link">📝 默写练习</a>
  </header>

  <!-- Hamburger Menu -->
  <div class="menu-overlay" id="menuOverlay"></div>
  <div class="menu-panel" id="menuPanel">
    <div class="menu-header">
      <h3>菜单</h3>
      <button class="menu-close" id="menuClose">×</button>
    </div>
    
    <div class="menu-section">
      <label class="menu-label">搜索经文</label>
      <input type="text" class="menu-search" id="menuSearchInput" placeholder="搜索经文或出处...">
    </div>

    <div class="menu-section">
      <label class="menu-label">查看方式</label>
      <div class="menu-tabs">
        <button class="menu-tab active" data-view="all">📖 全部经文</button>
        <button class="menu-tab" data-view="groups">📚 分组查看</button>
        <button class="menu-tab" data-view="books">📜 按书卷查看</button>
      </div>
    </div>

    <div class="menu-section">
      <button class="menu-action" id="menuSelectAll">全选/取消全选</button>
      <div class="menu-status" id="menuSelectedCount">已选择: 0</div>
    </div>
  </div>

  <main class="main">
    <div class="view-container">
      <div id="view-all" class="view-content active">
        <div class="loading">加载中...</div>
      </div>
      
      <div id="view-groups" class="view-content">
        <div class="loading">加载中...</div>
      </div>
      
      <div id="view-books" class="view-content">
        <div class="loading">加载中...</div>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/view-utils.js"></script>
  <script>
    // Application state
    const state = {
      verses: [],
      groups: [],
      currentView: 'all',
      searchQuery: '',
      filteredVerses: []
    };

    // DOM elements
    const elements = {
      hamburger: document.getElementById('hamburger'),
      menuOverlay: document.getElementById('menuOverlay'),
      menuPanel: document.getElementById('menuPanel'),
      menuClose: document.getElementById('menuClose'),
      menuTabs: document.querySelectorAll('.menu-tab'),
      menuSearchInput: document.getElementById('menuSearchInput'),
      menuSelectAll: document.getElementById('menuSelectAll'),
      menuSelectedCount: document.getElementById('menuSelectedCount'),
      viewAll: document.getElementById('view-all'),
      viewGroups: document.getElementById('view-groups'),
      viewBooks: document.getElementById('view-books')
    };

    // Initialize components
    const scriptureData = new ScriptureData();
    const selectionManager = new SelectionManager();
    
    const hamburgerMenu = new HamburgerMenu(elements, {
      onTabSwitch: (view) => switchTab(view),
      onSearch: (query) => performSearch(query),
      onSelectAll: () => selectionManager.toggleAll(state.filteredVerses)
    });

    // Selection change handler
    selectionManager.onSelectionChange((selectedVerses) => {
      hamburgerMenu.updateSelectedCount(selectedVerses.size);
      renderCurrentView();
    });

    // Switch tab function
    function switchTab(view) {
      state.currentView = view;
      hamburgerMenu.updateActiveTab(view);
      
      // Update content visibility
      document.querySelectorAll('.view-content').forEach(content => {
        content.classList.toggle('active', content.id === `view-${view}`);
      });
      
      renderCurrentView();
      hamburgerMenu.close();
    }

    // Search functionality
    function performSearch(query) {
      state.searchQuery = query;
      state.filteredVerses = ViewUtils.performSearch(state.verses, query);
      renderCurrentView();
    }

    // Render current view
    function renderCurrentView() {
      let html = '';
      
      switch (state.currentView) {
        case 'all':
          html = ViewUtils.renderAllView(state.filteredVerses, selectionManager.selectedVerses);
          elements.viewAll.innerHTML = html;
          break;
        case 'groups':
          html = ViewUtils.renderGroupsView(state.filteredVerses, state.groups, selectionManager.selectedVerses);
          elements.viewGroups.innerHTML = html;
          break;
        case 'books':
          html = ViewUtils.renderBooksView(state.filteredVerses, selectionManager.selectedVerses, scriptureData.bookMapping);
          elements.viewBooks.innerHTML = html;
          break;
      }
    }

    // Load verses and initialize
    async function loadVerses() {
      try {
        const data = await scriptureData.initialize();
        state.verses = data.verses;
        state.groups = data.groups;
        state.filteredVerses = [...state.verses];
        
        hamburgerMenu.updateSelectedCount(0);
        renderCurrentView();
        
      } catch (error) {
        console.error("Failed to load verses:", error);
        const errorMessage = ViewUtils.showError("加载失败：请确认 verses/ 目录下有 JSON 文件，或提供 groups.json");
        document.querySelectorAll('.view-content').forEach(content => {
          content.innerHTML = errorMessage;
        });
      }
    }

    // Checkbox event delegation
    document.addEventListener('change', (e) => {
      if (e.target.classList.contains('verse-checkbox')) {
        const reference = e.target.dataset.reference;
        selectionManager.toggle(reference, e.target.checked);
      }
    });

    // Initialize
    loadVerses();
  </script>
</body>
</html>
